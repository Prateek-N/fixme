<!DOCTYPE html>
<html lang="en" theme="system" scheme="dynamic" style="--base-font-size:14">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FixMyFinance</title>
  <meta name="description" content="Local, private bank statement diagnosis."/>
  
  <style>
    /* Inter Font for the standard typography */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    /* Space Grotesk for big numbers */
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    /* Caveat for "handwritten" look */
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap');
  </style>

  <link rel="stylesheet" href="styles.css" />
  <script src="screens-bundle.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Clean minimal container for the App router to inject into -->
  <main id="app-root" style="width: 100vw; height: 100vh; overflow-y: auto; background: var(--page-bg, #f3f3f2)">
  </main>
</body>
</html>
